<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本旅遊刷卡／PayPay 回饋速查與記帳</title>
<style>
:root{--bg:#FAF6F0;--grid:#F5EFE6;--card:#FFFDF9;--tea:#C8A98E;--latte:#8C6A52;--pink:#F7E4E6;--rose:#E8B4B8;--red:#D93838;--redbg:#FDE8E8;--tx:#4A3B32;--ln:#E9DFD2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A221D;--grid:#332A24;--card:#3A302A;--pink:#4A3538;--tx:#F1E7DC;--ln:#54463C;--redbg:#4D2626;--red:#FF6B6B}}
*{box-sizing:border-box}html{scroll-padding-top:120px}
body{margin:0;background:var(--bg) repeating-linear-gradient(0deg,transparent 0 23px,var(--grid) 23px 24px);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;font-size:15px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--tea);padding:8px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:21}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:16px;margin:0;color:var(--latte)}
.rate{font-size:13px}.rate select{padding:2px 6px;font-size:13px}.rate input{width:64px;padding:2px 6px;border:1px solid var(--tea);border-radius:8px;background:var(--bg);color:var(--tx)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
nav button{flex:none;border:1px solid var(--tea);background:var(--bg);color:var(--latte);border-radius:99px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--latte);color:#fff;border-color:var(--latte)}
main{max-width:760px;margin:0 auto;padding:12px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 14px;box-shadow:0 3px 10px rgba(140,106,82,.12)}
.c h2,.c h3{margin:0 0 6px;color:var(--latte);font-size:17px}
.tag{display:inline-block;background:var(--pink);color:var(--latte);border-radius:99px;padding:1px 10px;font-size:12px;margin:0 4px 4px 0}
.red{color:var(--red);font-weight:800;font-size:18px}
.capbox{background:var(--redbg);border:1px solid var(--rose);border-radius:12px;padding:8px 10px;margin:8px 0}
.capbox div{font-size:16px}.n{color:var(--red);font-weight:800;font-size:21px}.capbox small .n{font-size:17px}
.capbox small{color:var(--tx);font-weight:400;font-size:12px}
.st{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--ln);color:var(--tx)}
.step{border-left:4px solid var(--tea);padding:2px 0 2px 10px;margin:10px 0}
.step b{color:var(--latte)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btns a,.b{display:inline-block;background:var(--tea);color:#fff;text-decoration:none;border:0;border-radius:10px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.btns a.reg{background:var(--red)}.btns a{max-width:100%;white-space:normal}.cp{margin:10px 0;padding-top:8px;border-top:1px dashed var(--ln)}.cp small{display:block;margin-top:4px;line-height:1.5}.b.g{background:var(--rose);color:#4A3B32}.b.x{background:transparent;color:var(--red);border:1px solid var(--red);padding:1px 8px}
input,select{font:inherit;padding:8px;border:1px solid var(--tea);border-radius:10px;background:var(--bg);color:var(--tx);max-width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.row>*{flex:1 1 110px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border:1px solid var(--tea);background:var(--card);color:var(--latte);border-radius:99px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--rose);color:#4A3B32;border-color:var(--rose);font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--grid);border:1px solid var(--ln);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--red)}
details{margin-top:8px}summary{cursor:pointer;color:var(--latte);font-weight:700}
.warn{background:var(--pink);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:14px}
.rec{display:flex;justify-content:space-between;gap:6px;align-items:center;border-top:1px dashed var(--ln);padding:4px 0;font-size:14px}
ul{padding-left:20px;margin:4px 0}
.hide{display:none}
</style>
</head>
<body>
<header>
 <div class="top"><h1>🧾 日本刷卡速查手帳 · 2026 Q4</h1>
 <div class="rate">1 JPY = <input id="rate" type="number" step="0.001" min="0.01"> TWD</div><div class="rate">目前行程 <select id="wk"><option value="1">第一週 11/19(四)-11/22(日)</option><option value="2">第二週 11/23(一)-11/25(三)</option></select></div></div>

</header>
<main>

  <div class="row"><input id="amt" type="number" inputmode="decimal" placeholder="預計消費金額"><select id="cur"><option>JPY</option><option>TWD</option></select></div>
  <small id="conv"></small>
 </section>
 <div id="body"></div>
</main>

};

function info(id){const c=C[id];let cap=c.cap,p=c.p,rate=c.rate,note=c.note;
 if(id==='sj'){if(S.jcb==='a'){cap=10000;p='期';rate='5%（未登錄滿額加碼）';note='國外基本 2% 無上限 ＋ 特選日本 3%（每期上限 NT$300）。超過 1 萬後只剩基本 2%，請立刻換刷玉山 Unicard UP 選 4.5%！'}else{cap=20000;p='季';rate='最高 10%（已登錄滿額加碼）';note='上述 5% ＋ 日韓泰實體每季累積滿 NT$20,000 再加碼 5%（須搶每季限量 5,000 名登錄；每季上限 NT$1,000，須累積滿 NT$20,000 才觸發）。'}}
 if(id==='un'){cap={up:142857,any:40000,simple:50000}[S.uni];rate={up:'4.5%（UP 選）',any:'4.5%（任意選 3.5%）',simple:'4.0%（簡單選 3%）'}[S.uni]}
 const used=S.recs.filter(r=>r.c===id).reduce((a,r)=>a+r.twd,0);return{cap,p,rate,note,used,rem:Math.max(0,cap-used)}}
const amtTwd=()=>cur==='JPY'?amt*S.rate:amt;
function capbox(id){const i=info(id),a=amtTwd();
 const s=i.rem<=0?(id==='q1'?'🔴 第一週已封頂並鎖定（請改刷玉山 Wallet／實體卡，11/23 週一重置）':'🔴 已封頂（請換下一張！）'):(a>i.rem?'🟡 本筆將超過上限（剩餘高回饋額度僅 NT$'+fmt(i.rem)+'）':'🟢 額度充足');

 return `<article class="c"><h3>${c.n}</h3><span class="tag">回饋 ${i.rate}</span><span class="tag">${i.p}上限</span><p style="margin:4px 0">${i.note}</p>${tg}${capbox(id)}<div class="warn">⚠️ 條件：${c.cond}</div>${c.st.length?`<details open><summary>特定店家加碼／優惠清單</summary><ul>${c.st.map(s=>`<li><b>${s[0]}：</b>${s[1]}</li>`).join('')}</ul></details>`:''}${btns(c)}</article>`}

const T=[['pri','📌 優先順序'],['pp','📱 PayPay 掃碼'],['phy','💳 實體刷卡'],['ven','🛍️ 消費場所'],['led','📒 記帳與額度']];
function ledger(){const ids=Object.keys(C);
 return `<article class="c"><h2>記一筆</h2><div class="row"><select id="lc">${ids.map(i=>`<option value="${i}">${C[i].s||C[i].n.split('（')[0]}</option>`).join('')}</select></div><div class="row"><input id="la" type="number" inputmode="decimal" placeholder="金額"><select id="lu"><option>JPY</option><option>TWD</option></select></div><div class="row"><input id="ln" placeholder="店家備註（如：GU 心齋橋）"></div><button class="b" id="add">＋ 記一筆</button></article>`+
 ids.map(id=>{const i=info(id),pc=i.cap?Math.min(100,i.used/i.cap*100):0,rs=S.recs.filter(r=>r.c===id);
 return `<article class="c"><h3>${C[id].n}</h3><div class="bar"><i style="width:${pc}%"></i></div><div class="capbox"><div>已刷 NT$ ${fmt(i.used)} ／ 封頂 NT$ <span class="n">${fmt(i.cap)}</span>（每${i.p}） ／ 剩餘可刷 NT$ <span class="n">${fmt(i.rem)}</span> <small>（約 ¥ <span class="n">${fmt(jpy(i.rem))}</span>）</small></div></div>${rs.map(r=>`<div class="rec"><span>${new Date(r.t).toLocaleDateString('zh-TW')} ${esc(r.note||'')} · NT$${fmt(r.twd)}${r.jpy?'（¥'+fmt(r.jpy)+'）':''}</span><button class="b x" data-d="${r.id}">刪除</button></div>`).join('')}<div class="btns"><button class="b g" data-z="${id}">此卡歸零</button></div></article>`}).join('')+`<button class="b x" id="zall">⚠️ 全部歸零</button>`}

 if(v[3])h+=`<p><b>📱 若店家可用 PayPay：</b></p>`+route('A');

 return h+coupons(v)}

 $('#nav').innerHTML=T.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('');

 $('#conv').textContent=amt?(cur==='JPY'?`≈ NT$${fmt(amt*S.rate)}`:`≈ ¥${fmt(amt/S.rate)}`):'輸入金額後，每張卡會顯示剩餘額度狀態';

 if(tab==='pri')b.innerHTML=route('A')+route('B')+route('C');
 else if(tab==='pp')b.innerHTML=card(rid('qp'))+card('ew');
 else if(tab==='phy')b.innerHTML=['ek','sd','sj','un'].map(card).join('');

 const jt=$('#jt');if(jt)jt.onchange=()=>{S.jcb=jt.checked?'b':'a';save();render()};
 const ut=$('#ut');if(ut){ut.value=S.uni;ut.onchange=()=>{S.uni=ut.value;save();render()}}
}
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.t){tab=t.dataset.t;render();scrollTo(0,0)}
 else if(t.dataset.v){venue=+t.dataset.v;render()}
 else if(t.dataset.d){S.recs=S.recs.filter(r=>r.id!=t.dataset.d);save();render()}
 else if(t.dataset.z){if(confirm('確定將此卡歸零？')){S.recs=S.recs.filter(r=>r.c!==t.dataset.z);save();render()}}
 else if(t.id==='zall'){if(confirm('確定清除全部記帳？')){S.recs=[];save();render()}}
 else if(t.id==='add'){const a=parseFloat($('#la').value);if(!(a>0))return alert('請輸入金額');const cid=$('#lc').value;if((cid==='q1'||cid==='q2')&&info(cid).rem<=0)return alert('此週全支付已封頂並鎖定，請改刷玉山 Wallet／實體卡');const u=$('#lu').value;
  S.recs.push({id:Date.now(),c:$('#lc').value,twd:u==='JPY'?Math.round(a*S.rate):Math.round(a),jpy:u==='JPY'?a:0,note:$('#ln').value,t:Date.now()});save();render()}});
$('#rate').value=S.rate;S.wk=S.wk||(new Date()>=new Date(2026,10,23)?'2':'1');$('#wk').value=S.wk;$('#wk').onchange=e=>{S.wk=e.target.value;save();render()};
